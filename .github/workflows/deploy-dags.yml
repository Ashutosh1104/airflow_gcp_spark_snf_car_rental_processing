name: Deploy DAGs
on:
  push:
    branches: [main]
    paths:
      - "airflow_dags/**"
      - "spark_job/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  COMPOSER_ENV: ${{ vars.COMPOSER_ENV || 'airflow-de22' }} # CHANGE HERE:new env
  COMPOSER_REGION: ${{ vars.COMPOSER_REGION || 'us-central1' }} # CHANGE HERE: new env
  DAGS_DIR: airflow_dags   # CHANGE HERE for changing DAGs folder
  SPARK_JOB_DIR: spark_job
  SPARK_JOB_GCS_URI: gs://gcs_bucket_for_snf/car_rental_spark_job

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get Composer DAG folder
        id: composer
        run: |
          PREFIX=$(gcloud composer environments describe "$COMPOSER_ENV" \
            --location "$COMPOSER_REGION" --format="value(config.dagGcsPrefix)")
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT

      - name: Sync DAGs
        run: gsutil -m rsync -r -d "$DAGS_DIR/" ${{ steps.composer.outputs.prefix }}/

      - name: Sync Spark job files
        run: gsutil -m rsync -r -d "$SPARK_JOB_DIR/" "$SPARK_JOB_GCS_URI/"